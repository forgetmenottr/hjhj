<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Timetable mark on a 16 px grid: Catppuccin Mocha base tile, mauve header
       and class cells, one free slot outlined. -->
  <rect width="16" height="16" rx="3" fill="#1e1e2e"/>
  <g fill="#cba6f7">
    <rect x="1" y="1" width="14" height="4" rx="1"/>
    <rect x="1" y="6" width="4" height="4" rx="0.5"/>
    <rect x="6" y="6" width="4" height="4" rx="0.5"/>
    <rect x="11" y="6" width="4" height="4" rx="0.5"/>
    <rect x="1" y="11" width="4" height="4" rx="0.5"/>
    <rect x="6" y="11" width="4" height="4" rx="0.5"/>
  </g>
  <rect x="11.5" y="11.5" width="3" height="3" rx="0.5" fill="none" stroke="#cba6f7"/>
</svg>
